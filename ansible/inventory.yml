all:
  vars:
    ansible_user: admin
    ansible_ssh_private_key_file: ~/.ssh/id-rda-infra.key
    ansible_python_interpreter: /usr/bin/python3
  children:
    my_infra:
      children:
        dev:
          hosts:
            app-dev:
              ansible_host: 192.168.56.10
              django_debug: true
        prod:
          hosts:
            app-prod1:
              ansible_host: 192.168.56.11
              django_debug: false
    ci:
      hosts:
        jenkins:
          ansible_host: 192.168.56.20
          ufw_ports: ["22", "8080"]
